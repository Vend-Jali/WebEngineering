<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard</title>
  <meta name="description" content="Diese Seite zeigt das Leaderboard der besten Versuche.">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>

  <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "TippTest",
        "description": "Ein Spiel um seine Tippgeschwindigkeit und Genauigkeit zu testen.",
        "url": "https://example.com/index.html"
    }
  </script>
</head>
<body>
  <header>
    <nav aria-label="Hauptmenü">
      <a href="index.html">Start</a>
      <a href="tipptest.html">Tipp Test</a>
      <a href="ueber.html">Über</a>
    </nav>
  </header>

  <main>
    <h1>Leaderboard</h1>

    <form id="suchfeld">
        <label for="suchfeld">Suche</label>
        <p>
            <label for="name">Name</label>
            <input id="name" name="username" type="text" required minlength="3">
        </p>

        <p>
            <label for="email">E-Mail</label>
            <input id="email" name="useremail" type="email" required>
        </p>

        <p>
            <label for="alter">Alter</label>
            <input id="alter" name="useralter" type="number" min="16">
        </p>
        
        <button type="submit">Suchen</button>
    </form>

  </main>

  <footer>
    <p>Web-Engineering 1 · DHBW Karlsruhe · <span id="jahr"></span></p>
  </footer>
</body>
</html>
